# RENDERED by `busbar-release plugin heal busbar-secret-c` from GetBusbar/busbar-release template/; a hand
# edit is overwritten by the next sync. THIS REPO TESTS ITSELF AGAINST BUSBAR with the fleet's ONE
# harness: busbar's reusable plugin-ci.yml, taken at the busbar commit this repo pins (.busbar-ref), so
# the CI logic, the gates (busbar scripts/fleet/plugin-gates.py), the dependency policy
# (.github/fleet/deps.toml) and the contract move together (OWNER 2026-10-02). No CI logic lives here.
name: ci

on:
  # A tree is tested once: on its pull request into dev and on the push that lands it on dev. qa and
  # main take dev's commits by pull request whose head is that tested commit: the checks it carries
  # from dev's run satisfy the ruleset, and nothing re-tests it. Any other head: run this by hand
  # (workflow_dispatch) on its branch.
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch: {}

# A newer push to a pull request cancels its older run (only the newest commit can merge); a push to
# dev and a dispatch run to the end.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    uses: GetBusbar/busbar/.github/workflows/plugin-ci.yml@3faee1e368c7b4d158d49d6f46ad52d5370f6c3e
    with:
      service: none
      busbar_checkout: false
      macos_test: "cargo test --workspace --locked"
      extra_test: "set -euo pipefail; work=$(mktemp -d); trap 'rm -rf \"$work\"' EXIT; inc=\"$BUSBAR_CHECKOUT/crates/busbar-contract/include\"; cc -std=c11 -Wall -Wextra -Werror -pedantic -pthread -DBUSBAR_SECRET_C_UNIT -I \"$inc\" secret-c/tests/unit.c secret-c/busbar_secret_c.c -o \"$work/unit\"; \"$work/unit\"; cc -std=c11 -Wall -Wextra -Werror -pedantic -pthread -DBUSBAR_SECRET_C_UNIT -fsanitize=thread -g -I \"$inc\" secret-c/tests/unit.c secret-c/busbar_secret_c.c -o \"$work/unit-tsan\"; TSAN_OPTIONS=halt_on_error=1 \"$work/unit-tsan\""
      plugin_crate: busbar-secret-c
      plugin_kind: secret
      plugin_alias: secret-c
      plugin_lang: c
      c_dir: secret-c
      source_role: c_abi_test
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
