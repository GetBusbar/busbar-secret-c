# RENDERED by `busbar-release plugin sync busbar-secret-c` from GetBusbar/busbar-release template/; a hand
# edit is overwritten by the next sync. On a v* tag: this repo's own ci.yml (the fleet harness) on the
# tagged commit, then busbar's plugin-release.yml (build, sign, pack, publish), then the consumer
# verification of what was published, each at the busbar commit this repo pins.
name: release

on:
  push:
    # `vX.Y.Z-dev.N` is a signed PRE-RELEASE from dev (never main/qa); other suffixed tags start nothing.
    tags: ["v*", "!v*-*", "v*-dev.*"]
  # A tag pushed with GITHUB_TOKEN starts no workflow, so a workflow that tags dispatches this on
  # the tag ref (`gh workflow run release.yml --ref <tag>`).
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write
  attestations: write
  issues: write
  actions: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit
  release:
    needs: ci
    uses: GetBusbar/busbar/.github/workflows/plugin-release.yml@8fc3b1b2a6d123575a77ce505e501b595fb24cef
    with:
      plugin_crate: busbar-secret-c
      manifest_name: busbar-secret-c
      plugin_alias: c
      plugin_kind: secret
      asset_prefix: busbar-secret-c
      description: "First-party signed kind:secret plugin library, written in C from busbar_plugin.h alone: the c secret, packaged as a droppable busbar plugin. Drop the signed tarball into plugins/."
      lib_only: false
      needs_prompt: ""
      needs_user: ""
      declares_file: "secret-c/declares.json"
      plugin_lang: c
      c_dir: secret-c
    secrets: inherit
  consumer-verify:
    needs: release
    if: ${{ !cancelled() }}
    uses: GetBusbar/busbar/.github/workflows/plugin-consumer-verify.yml@8fc3b1b2a6d123575a77ce505e501b595fb24cef
    with:
      version: ${{ github.ref_name }}
      asset_prefix: busbar-secret-c
      plugin_name: busbar-secret-c
      plugin_alias: c
      plugin_kind: secret
      bundle_image: ""
      bundle_env: ""
    secrets: inherit
